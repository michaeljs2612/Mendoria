    const chipClock = document.getElementById("chip-clock");
    const drawChip = () => {
      chipNum.textContent = String(Math.max(1, Math.min(15, Math.round(chipCount.v))));
      chipClock.style.setProperty("--sweep", chipCount.v * 6 + "deg");
    };
    tl.fromTo(chipCount, { v: 1 }, { v: 15, duration: 0.7, ease: "power1.out", onUpdate: drawChip }, 50.63);
    tl.fromTo("#chip-hand", { rotation: 6 }, { rotation: 90, duration: 0.7, ease: "power1.out" }, 50.63);
    tl.to("#chip-plate", { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, 52.52);

    tl.to({}, { duration: 57.0 }, 0);
    window.__timelines["overlays"] = tl;
  </script>
</template>
