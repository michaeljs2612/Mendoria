<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Mendoria Lolo UGC, final edit of Final1.mp4 (57 s, 4:5, 30 fps).
         Brand: Merriweather Bold black wordmark; Montserrat Bold on-screen text; green #1F8A70, dark #1D2B29, mint #EAF5F1. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="57"
      data-width="1080"
      data-height="1350"
    >
      <div
        id="footage"
        data-composition-id="footage"
        data-composition-src="compositions/footage.html"
        data-start="0"
        data-duration="57"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 1"
      ></div>
      <div
        id="overlays"
        data-composition-id="overlays"
        data-composition-src="compositions/overlays.html"
        data-start="0"
        data-duration="57"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 2"
      ></div>

      <audio id="vo" src="assets/final1_audio.wav" data-start="0" data-duration="57" data-track-index="4" data-volume="1"></audio>
      <!-- Subtle X-mark swipe (supplied SFX), its two swipes land on the X's two strokes -->
      <audio id="sfx-x" src="assets/sfx/xmark.mp3" data-start="39.72" data-duration="0.86" data-track-index="5" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
